name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            build_command: npm run tauri -- build --bundles dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            build_command: npm run tauri -- build --bundles dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            build_command: npm run desktop:build:windows
            artifact_path: src-tauri/target/release/*-windows-x64-portable.exe

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop app
        run: ${{ matrix.build_command }}

      - name: Prepare Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/pocket-flipcard-desktop.exe "src-tauri/target/release/pocket-flipcard-desktop_${version}-windows-x64-portable.exe"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.dmg
            release-assets/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 当前未配置 Apple Developer ID 或 Windows 代码签名证书。
# 正式发布前可在仓库 Secrets 中加入签名配置，避免用户看到系统安全警告。

[package]
name = "pocket-flipcard-desktop"
version = "0.1.0"
description = "A local-only desktop client for Pocket flipcard exports"
authors = ["Pocket Flipcard"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
